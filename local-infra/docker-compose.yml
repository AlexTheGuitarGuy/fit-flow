name: fit-flow-local-infra

services:
  kafka-broker:
    image: apache/kafka:4.2.0
    container_name: kafka-broker
    volumes:
      - kafka-data:/var/lib/kafka/data
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://kafka-broker:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,EXTERNAL://kafka-broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - 9092:29092
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - fit-flow

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
    volumes:
      - ./kui/config.yml:/etc/kafkaui/dynamic_config.yaml
    depends_on:
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fit-flow

  schema-registry:
    image: confluentinc/cp-schema-registry:8.2.0
    container_name: schema-registry
    ports:
      - 8081:8081
    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://kafka-broker:9092
      - SCHEMA_REGISTRY_KAFKASTORE_TOPIC=_schemas
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:8081/subjects >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      kafka-broker:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fit-flow

  user-db:
    image: postgres:18.3-alpine
    container_name: user-db
    ports:
      - 15432:5432
    shm_size: 128mb
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d user']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - fit-flow
    volumes:
      - user-postgres-data:/var/lib/postgresql/data

  workout-db:
    image: postgres:18.3-alpine
    container_name: workout-db
    ports:
      - 25432:5432
    shm_size: 128mb
    environment:
      POSTGRES_DB: workout
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d workout']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - fit-flow
    volumes:
      - workout-postgres-data:/var/lib/postgresql/data

  stats-db:
    image: postgres:18.3-alpine
    container_name: stats-db
    ports:
      - 35432:5432
    shm_size: 128mb
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d stats']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - fit-flow
    volumes:
      - stats-postgres-data:/var/lib/postgresql/data

  notification-db:
    image: postgres:18.3-alpine
    container_name: notification-db
    ports:
      - 45432:5432
    shm_size: 128mb
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d notification']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - fit-flow
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8.6.2
    container_name: redis
    command: ['redis-server', '--requirepass', 'admin', '--appendonly', 'yes']
    ports:
      - 6379:6379
    healthcheck:
      test:
        ['CMD-SHELL', 'redis-cli -a admin --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - fit-flow
    volumes:
      - redis-data:/data

networks:
  fit-flow:
    driver: bridge

volumes:
  kafka-data:
  user-postgres-data:
  workout-postgres-data:
  stats-postgres-data:
  notification-postgres-data:
  redis-data:
